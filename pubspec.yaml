name: meshly
description: "Meshly — a minimal messenger for people you trust, over the Meshtastic LoRa mesh (BLE)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cupertino_icons: ^1.0.8
  drift: ^2.18.0
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.3.9
  flutter_local_notifications: ^18.0.0
  mobile_scanner: ^7.0.0
  path: ^1.9.0
  path_provider: ^2.1.0
  permission_handler: ^12.0.3
  protobuf: ^6.0.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.0
  sqlite3_flutter_libs: ^0.5.0
  uuid: ^4.5.0

dev_dependencies:
  build_runner: ^2.4.0
  drift_dev: ^2.18.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
